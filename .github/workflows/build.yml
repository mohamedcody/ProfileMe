name: CI Build & Lint

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: portfolio-app/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-app
          npm ci

      - name: Run Lint
        run: |
          cd portfolio-app
          npm run lint

      - name: Build Application
        run: |
          cd portfolio-app
          npm run build
